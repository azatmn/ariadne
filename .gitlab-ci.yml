stages:
  - image
  - test
  - build

variables:
  DOCKER_IMAGE: $CI_REGISTRY_IMAGE
  GOPATH: /go
  GOMODCACHE: /go/pkg/mod

  # Версия Go — в ОДНОМ месте. Она же в теге образа для тестов, потому что
  # содержимое образа целиком определяется ею.
  #
  # Раньше тег был `ci:1.26` — плавающий, как `golang:1.26-alpine`. Образ в
  # реестре остался с Go 1.26.3, `Dockerfile.ci` уже говорил 1.26.5, и понять
  # это по тегу было нельзя: тесты шли на старом компиляторе, а проверка
  # уязвимостей находила в нём три дыры и валила сборку. Меняешь версию —
  # меняется тег, и образ пересобирается сам.
  GO_VERSION: "1.26.6"

# ──────────── Образ для тестов ────────────

# Собирается САМ, когда его нет в реестре. Иначе живём с образом, который
# кто-то однажды собрал руками, и никто не знает, что внутри.
#
# Запускается ТОЛЬКО при изменении своих входов. Раньше джоба бежала на каждый
# пуш и почти всегда печатала «пересобирать нечего» — но `docker:dind` она
# поднимала до проверки, а не после. Минуты уходили на то, чтобы задать реестру
# один вопрос.
ci-image:
  stage: image
  image: docker:latest
  services:
    - docker:dind
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - |
      if docker manifest inspect $CI_REGISTRY_IMAGE/ci:$GO_VERSION > /dev/null 2>&1; then
        echo "образ ci:$GO_VERSION уже в реестре, пересобирать нечего"
      else
        docker build --build-arg GO_VERSION=$GO_VERSION -t $CI_REGISTRY_IMAGE/ci:$GO_VERSION -f Dockerfile.ci .
        docker push $CI_REGISTRY_IMAGE/ci:$GO_VERSION
      fi
  rules:
    # Содержимое образа определяют ровно два файла: `Dockerfile.ci` и
    # `GO_VERSION` из этого файла. Не тронуты — образ в реестре уже верный.
    #
    # Правка этого файла пересобирает образ, даже если `GO_VERSION` в ней не
    # менялся. Так и задумано: лишняя сборка стоит трёх минут, а прогон тестов
    # на старом компиляторе не стоит ничего и ничего не значит.
    - if: $CI_MERGE_REQUEST_ID
      changes: &ci-image-inputs
        - Dockerfile.ci
        - .gitlab-ci.yml
    - if: $CI_COMMIT_BRANCH
      changes: *ci-image-inputs
    # Запасной ход на случай, когда образа нет, а входы не менялись: реестр
    # почистили, или ветка ушла от истории. Кнопка в интерфейсе; пока её не
    # нажали, минут она не тратит и пайплайн не держит.
    - when: manual
      allow_failure: true

# ──────────── CI: тесты ────────────

test:
  stage: test
  image: $CI_REGISTRY_IMAGE/ci:$GO_VERSION
  cache:
    key: go-mod-${CI_COMMIT_REF_SLUG}
    paths:
      - /go/pkg/mod/
    policy: pull-push
  script:
    - go mod download
    - CGO_ENABLED=1 go vet ./...
    - CGO_ENABLED=1 go test -race ./...
    # Уязвимости в зависимостях и в стандартной библиотеке. Раз в аудит их
    # искать поздно: между аудитами прошло три месяца, и семнадцать достижимых
    # находок никого не потревожили. Проверка дешёвая, пусть кричит сама.
    #
    # Падать по ней НЕ даём (`|| true` нет намеренно — падаем): молчаливое
    # предупреждение в логе CI никто не читает, а обновление версии стоит
    # получаса.
    - go install golang.org/x/vuln/cmd/govulncheck@latest
    - govulncheck ./...
  rules:
    - if: $CI_MERGE_REQUEST_ID
    - if: $CI_COMMIT_BRANCH

# ──────────── CD: сборка Docker-образа ────────────

# Собирается по тегу, а на обычных коммитах ждёт нажатия.
#
# Раньше образ пересобирался на КАЖДЫЙ пуш в main, включая коммиты, которые его
# не меняют вовсе — правки комментариев, README, самих тестов. Сборка с двумя
# пушами в реестр стоит дороже всех тестов вместе взятых.
#
# Тегов в репозитории пока нет ни одного, поэтому кнопка на main обязательна:
# без неё образ перестал бы собираться совсем.
build:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker build --build-arg GO_VERSION=$GO_VERSION -t $DOCKER_IMAGE:$CI_COMMIT_SHORT_SHA -t $DOCKER_IMAGE:latest .
    - docker push $DOCKER_IMAGE:$CI_COMMIT_SHORT_SHA
    - docker push $DOCKER_IMAGE:latest
    # По тегу образ получает ещё и человекочитаемое имя: искать выкаченную
    # версию по короткому хешу неудобно.
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        docker tag $DOCKER_IMAGE:$CI_COMMIT_SHORT_SHA $DOCKER_IMAGE:$CI_COMMIT_TAG
        docker push $DOCKER_IMAGE:$CI_COMMIT_TAG
      fi
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
      allow_failure: true
