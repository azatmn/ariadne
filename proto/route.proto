syntax = "proto3";

package ariadne.v1;

option go_package = "ariadne/internal/gen/ariadne;ariadnepb";

// RouteService — асинхронная обработка маршрутов: сдать задачу → опрашивать по
// taskKey. Синхронный ResolveCollisions убран (потребителя на gRPC не было).
service RouteService {
  // SubmitTask принимает сжатый маршрут, ставит задачу в очередь, отдаёт taskKey.
  rpc SubmitTask(SubmitTaskRequest) returns (SubmitTaskResponse);
  // GetTask отдаёт статус и — при done — очищенный маршрут с длиной.
  rpc GetTask(GetTaskRequest) returns (GetTaskResponse);
  // GetTaskDebug отдаёт разбор по стадиям pipeline.
  rpc GetTaskDebug(GetTaskDebugRequest) returns (GetTaskDebugResponse);
}

message SubmitTaskRequest {
  string route_compressed = 1;
}

message SubmitTaskResponse {
  string task_key = 1;
}

message GetTaskRequest {
  string task_key = 1;
}

message GetTaskResponse {
  string task_key = 1;
  string status = 2;            // pending / done / failed
  string route_compressed = 3;  // при done
  double length_meters = 4;     // при done
  string error = 5;             // при failed

  // Километражу верить с оговоркой: результат настоящий, но неполный —
  // конвейеру не хватило времени или не был задан маршрутизатор, и часть дыр
  // осталась прямыми через поля.
  //
  // Отдельным полем, а НЕ новым значением status: новое значение сломало бы
  // живого клиента, который сверяется с "done".
  bool degraded = 6;            // при done

  // Та же оговорка словами, для человека при разборе.
  repeated string warnings = 7; // при done
}

message GetTaskDebugRequest {
  string task_key = 1;
}

message GetTaskDebugResponse {
  string task_key = 1;
  string status = 2;
  repeated StageStats debug = 3;
}

message StageStats {
  string name = 1;
  int32 points_before = 2;
  int32 points_after = 3;
  string elapsed = 4;
}
